name: Automated Build and Release

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/MrDiamond64/Hydra.git
          git fetch upstream main
          
          git merge upstream/main --allow-unrelated-histories --no-edit || true
          git push origin main || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build Hydra
        run: |
          dotnet restore
          dotnet build -c Release --output ./build_output

      - name: Publish Hydra as a release
        if: steps.sync.outputs.new != '0' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi

          gh release create latest ./build_output/* \
            --title "latest ($SHORT_SHA)" \
            --notes "Automated build from commit $SHORT_SHA" \
            --target main
